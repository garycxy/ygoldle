<script>
// =============== YGOPro 位运算解码 ===============
// 参考 YGOPro card.h / wiki
const TYPE_BITS = { 0x1: "monster", 0x2: "spell", 0x4: "trap" };
const ATTR_MAP = { 1: "地", 2: "水", 4: "火", 8: "风", 16: "光", 32: "暗", 64: "雷" };
// race 解码 (bit -> 中文名)
// 参考 YGOPro race 枚举：https://github.com/Fluorohydride/ygopro/blob/master/src/card.h
const RACE_BITS = [
  [0x1,  "战士"],   [0x2,  "魔法师"],  [0x4,  "天使"],
  [0x8,  "恶魔"],   [0x10, "不死"],    [0x20, "兽"],
  [0x40, "鸟兽"],   [0x80, "昆虫"],    [0x100, "水族"],
  [0x200,"炎族"],   [0x400,"岩石"],    [0x800, "植物"],
  [0x2000,"龙"],    [0x4000,"海龙族"],  [0x8000,"机械"],
  [0x10000,"雷族"], [0x20000,"念动力"], [0x40000,"幻想魔族"]
];

function decodeType(t) {
  if (t & 0x1) return "monster";
  if (t & 0x2) return "spell";
  if (t & 0x4) return "trap";
  return "monster";
}

// 三栏拆分 decode：
// typeLabel  — 基础大类：怪兽 / 魔法 / 陷阱（单值）
// summon     — 召唤方式：同调 / 超量 / 融合 / 仪式 / 连接 / 灵摆（怪兽专属，单值，空值允许）
// trait      — 特征：效果 / 调整 / 反转 / 特殊召唤 / 永续 / 速攻 / 场地 / 装备 / 反击 / 二重 / 灵魂 / 同盟 / 卡通 等
function decodeThreeParts(baseType, textTypes) {
  const typeLabel = baseType === "monster" ? "怪兽" : (baseType === "spell" ? "魔法" : "陷阱");
  if (!textTypes) return { typeLabel, summon: null, trait: null };
  const m = textTypes.match(/^\[([^\]]+)\]/);
  if (!m) return { typeLabel, summon: null, trait: null };
  const tags = m[1].split('|').map(s => s.trim());

  // 召唤方式（怪兽专属，互斥，优先级从上到下）
  const SUMMON_TAGS = ["同调", "超量", "融合", "仪式", "连接", "灵摆"];
  let summon = null;
  for (const t of SUMMON_TAGS) { if (tags.includes(t)) { summon = t; break; } }

  // 特征（跨类型，多种时按优先级取最具区分力的）
  let trait = null;
  if (baseType === "monster") {
    const MONSTER_TRAIT_PRIORITY = ["卡通", "同盟", "灵魂", "二重", "调整", "反转", "特殊召唤", "效果"];
    for (const t of MONSTER_TRAIT_PRIORITY) { if (tags.includes(t)) { trait = t; break; } }
  } else if (baseType === "spell") {
    const SPELL_TRAIT_PRIORITY = ["永续", "速攻", "场地", "装备"];
    for (const t of SPELL_TRAIT_PRIORITY) { if (tags.includes(t)) { trait = t; break; } }
  } else {
    const TRAP_TRAIT_PRIORITY = ["反击", "永续"];
    for (const t of TRAP_TRAIT_PRIORITY) { if (tags.includes(t)) { trait = t; break; } }
  }
  // 没有任何特征时，统一显示"通常"
  if (!trait) trait = "通常";

  return { typeLabel, summon, trait };
}

// =============== 效果分类（YGOPro 官方 category 位掩码 + desc fallback）===============
// YGOPro category bit N → 中文名（bit N = system 1100+N）
const CATEGORY_BIT_NAMES = {

  4: "返回手卡", 5: "返回卡组", 6: "手卡破坏", 7: "卡组破坏",
  8: "抽卡辅助", 9: "卡组检索", 10: "卡片回收", 11: "表示形式",
  12: "控制权", 13: "攻守变化", 14: "穿刺伤害", 15: "多次攻击",
  16: "攻击限制", 17: "直接攻击", 18: "特殊召唤", 19: "衍生物",
  20: "种族相关", 21: "属性相关", 22: "LP伤害", 23: "LP回复",
  24: "破坏耐性", 25: "效果耐性", 26: "指示物", 27: "幸运",
  28: "融合相关", 29: "同调相关", 30: "超量相关", 31: "效果无效"

  ["No.", ["编号","No.39","No.17","No.32","No.62","No.101","No.103","No.104","No.107","No.108","No.109","No.20","No.5","No.6","No.9","No.11","No.14","No.15","No.16","No.23","No.25","No.33","No.34","No.35","No.36","No.40","No.41","No.50","No.51","No.53","No.58","No.60","No.66","No.70","No.74","No.77","No.80","No.82","No.85","No.88","No.89","No.91","No.92","No.93","No.95","No.98","No.99"]],
  ["异热同心", ["异热同心","ZW-"]],

function matchSeries(name, desc) {
  if (!name) return null;
  const text = name + " " + (desc || "");
  for (const [series, kws] of SERIES_KEYWORDS) {
    for (const kw of kws) {
      if (kw && kw.length >= 2 && text.includes(kw)) return series;
    }
  }
  return null;
}

// 从 YGOPro category 值提取主效果标签
function categoryToEffectTags(categoryVal) {
  if (!categoryVal || categoryVal <= 0) return null;
  // 收集所有命中的 bit → 所有效果标签（多值）
  const tags = [];
  for (let bit = 0; bit < 32; bit++) {
    if ((categoryVal & (1 << bit)) !== 0 && CATEGORY_BIT_NAMES[bit]) {
      tags.push(CATEGORY_BIT_NAMES[bit]);
    }
  }
  if (tags.length === 0) return null;
  return tags.join(', ');
}

// 统一入口：优先 YGOPro category（多值），fallback 到 desc 关键词匹配（多值）
function matchEffectTag(dataId, textTypes, desc) {
  // 通常怪兽 → "无"
  if (textTypes && textTypes.includes('通常') && !textTypes.includes('效果') && !textTypes.includes('リバース')) {
    return "无";
  }
  // 优先查 YGOPro 官方 category
  if (YGOPRO_CATEGORY_MAP && dataId) {
    const val = YGOPRO_CATEGORY_MAP[String(dataId)];
    const tags = categoryToEffectTags(val);
    if (tags) return tags;
  }
  // Fallback：关键词匹配（也收集多个命中）
  if (!desc || !desc.trim()) return null;

  const EFFECT_TAGS = [
    ["魔陷破坏", ["破坏1张魔法", "破坏1张陷阱", "破坏魔法卡", "破坏陷阱卡", "破壊魔法", "破壊罠"]],

    ["效果无效", ["使效果无效", "效果无效化", "无效化", "無効化"]],
    ["卡组检索", ["从卡组把", "加入手卡", "加入手牌", "卡组から手札", "检索卡", "手札に加える"]],
    ["卡片除外", ["除外", "从游戏中除去", "除外して", "除外され"]],
    ["送去墓地", ["送去墓地", "送入墓地", "丢弃手卡", "丢弃卡组", "墓地送り"]],
    ["返回手卡", ["返回手卡", "回到手卡", "回到持有者手卡", "手札に戻"]],
    ["返回卡组", ["返回卡组", "回到卡组", "加入卡组洗切", "卡组に戻"]],
    ["抽卡辅助", ["从卡组抽", "ドロー", "抽卡"]],
    ["表示形式", ["表侧表示", "里侧表示", "反转召唤", "表示形式", "変更表示"]],
    ["特殊召唤", ["特殊召唤", "特殊召喚", "墓地から特殊召喚", "从墓地特殊召唤"]],
    ["直接攻击", ["直接攻击对方", "直接攻击", "相手に直接攻撃"]],
    ["攻击限制", ["不能攻击", "不能攻击宣言", "攻击表示", "攻击限制"]],
    ["攻守变化", ["攻击力上升", "攻击力下降", "守备力上升", "守备力下降", "攻守变化", "攻击力变成"]],
    ["LP伤害", ["给予伤害", "造成伤害", "ダメージを与え", "战斗伤害"]],
    ["LP回复", ["恢复 LP", "回复 LP", "恢复生命值", "LPを回復"]],
    ["融合相关", ["融合召唤", "融合素材"]],
    ["同调相关", ["同调召唤", "同调素材", "同步召唤"]],
    ["超量相关", ["超量召唤", "超量素材", "XYZ召唤"]],
    ["连接相关", ["连接召唤", "链接召唤", "连接素材"]],
    ["破坏耐性", ["不会被破坏", "不会被战斗或效果破坏", "不破壊"]],
    ["效果耐性", ["不受效果影响", "不受其他效果影响", "不受任何效果影响"]],
    ["控制权", ["夺取控制权", "获得控制权"]],
    ["衍生物", ["衍生物特殊召唤", "トークン"]],
    ["指示物", ["放置指示物", "カウンター"]],
    ["幸运", ["掷骰子", "投掷硬币", "骰子", "硬币"]],
  ];

  const descLower = desc.toLowerCase();
  const found = [];
  for (const [tagName, keywords] of EFFECT_TAGS) {
    for (const kw of keywords) {
      const idx = descLower.indexOf(kw.toLowerCase());
      if (idx === -1) continue;
      const before = descLower.substring(Math.max(0, idx-4), idx);
      if (/不能|不会|不可|无法|不得|禁止|不会被/.test(before)) continue;
      found.push(tagName);
      break; // 一个标签只要命中一个关键词就算，避免重复
    }
  }
  if (found.length === 0) return null;
  if (found.length === 1) return found[0];
  return found.join(', ');
}

function decodeAttr(a) {
  if (!a) return null;
  for (const [bit, label] of Object.entries(ATTR_MAP)) if ((a & parseInt(bit)) !== 0) return label;
  return null;
}
// race 解码 — 优先从 data.text.types 提取官方中文种族名
// text.types 格式: "[怪兽|通常] 雷/光\n[★3] 1000/500"
// 种族 = "] " 之后、"/" 之前、换行符之前的部分
function decodeRace(rawRace, textTypes) {
  // 方法 1: 从官方 text.types 正则提取（最可靠）
  if (textTypes) {
    const m = textTypes.match(/\]\s*([^/\n]+?)\s*[/\n]/);
    if (m && m[1]) {
      const race = m[1].trim();
      // 过滤：属性也可能单独在 types 里，确认不是空或非法
      if (race && race.length <= 10 && /^[\u4e00-\u9fa5A-Za-z\-・ ]+$/.test(race)) {
        return race;
      }
    }
  }
  // 方法 2: 回退位运算（兜底）
  if (!rawRace) return null;
  const hits = RACE_BITS.filter(([bit]) => (rawRace & bit) !== 0).map(([, l]) => l);
  return hits.length ? hits[0] : null;
}

function translatePackName(raw) {
  if (!raw) return null;
  // 先精确匹配
  if (PACK_CN[raw]) return PACK_CN[raw];
  // 去掉首尾空格
  const trimmed = raw.trim();
  if (PACK_CN[trimmed]) return PACK_CN[trimmed];
  // 格式：日文名 [ ENGLISH NAME ] — 提取英文部分再匹配
  const m = trimmed.match(/\[\s*([^\]]+?)\s*\]$/);
  if (m) {
    const en = m[1].trim();
    if (PACK_CN[en]) return PACK_CN[en];
    // 再尝试一些变体
    const noSpace = en.replace(/\s+/g, ' ').trim();
    if (PACK_CN[noSpace]) return PACK_CN[noSpace];
    const upper = en.toUpperCase();
    if (PACK_CN[upper]) return PACK_CN[upper];
    // 把 EN 空格换成空（如 THE SHINING DARKNESS -> THESHININGDARKNESS）
    if (PACK_CN[upper.replace(/\s+/g, '')]) return PACK_CN[upper.replace(/\s+/g, '')];
    // 把 EN 空格换成下划线
    if (PACK_CN[upper.replace(/\s+/g, '_')]) return PACK_CN[upper.replace(/\s+/g, '_')];
  }
  // 没找到翻译 — 返回原名（表示此卡包在 PACK_CN 中暂无翻译）
  return raw;
}

// =============== 存储层：IndexedDB（解决 localStorage 5MB 限制） ===============
// localStorage 只用来存小量元数据（MD5、连胜）
// 大量卡片数据走 IndexedDB（几乎无上限）
const DB_NAME = "ygoldle";
const DB_VERSION = 2;
const STORE_CARDS = "cards";
const STORE_META = "meta";

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE_CARDS)) db.createObjectStore(STORE_CARDS, { keyPath: "cid" });
      if (!db.objectStoreNames.contains(STORE_META)) db.createObjectStore(STORE_META, { keyPath: "key" });
      // 版本升级时清空老数据（强制重新下载处理）
      if (e.oldVersion < DB_VERSION) {
        const tx = e.target.transaction;
        if (tx.objectStoreNames.contains(STORE_CARDS)) tx.objectStore(STORE_CARDS).clear();
        if (tx.objectStoreNames.contains(STORE_META)) tx.objectStore(STORE_META).clear();
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbPutCards(cards) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_CARDS, "readwrite");
    const store = tx.objectStore(STORE_CARDS);
    // 先清空再批量写入（用 cid 作 keyPath 自然按 cid 存储）
    store.clear();
    for (const c of cards) store.put(c);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGetAllCards() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_CARDS, "readonly");
    const req = tx.objectStore(STORE_CARDS).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

const API_BASE = "https://ygocdb.com/api/v0";
const META_MD5 = "cards_md5_v18"; // v18: series 支持逗号分隔多值 + orange 部分命中
const STREAK_KEY = "ygoldle_streak";

function setLoaderProgress(main, sub) {
  const p = document.getElementById('loader-progress');
  const s = document.getElementById('loader-subtitle');
  if (p && main) p.textContent = main;
  if (s && sub) s.textContent = sub;
}

async function loadCardsFromAPI() {
  // 先 await 完所有 YGOPro 官方数据再处理卡片
  await Promise.all([
    loadYGOProCategoryMap(),
    loadYGOProPackMap(),
    loadYGOProNameMap(),
    loadYGOProSeriesMap()
  ]);

  setLoaderProgress("使用本地数据...", "版本固定");
  let latestMD5 = "a8d0876840e74dd4f084c774929754ea";

  // 从 IndexedDB 读缓存（存的是已解码好的卡数组，用 cid 作 keyPath）
  const cachedMD5 = localStorage.getItem(META_MD5);
  if (cachedMD5 && cachedMD5 === latestMD5) {
    try {
      const cached = await idbGetAllCards();
      if (cached && cached.length > 1000) {
        setLoaderProgress("使用 IndexedDB 缓存", `${cached.length} 张卡`);
        // 动态补 image URL（从 id 拼，省存储）
        return cached.map(c => ({
          ...c,
          image: `https://cdn.233.momobako.com/ygopro/pics/${c.id}.jpg`
        }));
      }
    } catch(e) { console.warn("IDB read failed, refetch:", e); }
  }

  setLoaderProgress("下载 releaseDates.json", "卡包中文名映射");
  const [zipResp, rdResp] = await Promise.all([
    fetch('cards.zip'),
    fetch('releaseDates.json')
  ]);

  setLoaderProgress("解压 cards.zip", "JSZip 处理中...");
  const zipBuf = await zipResp.arrayBuffer();
  const zip = await JSZip.loadAsync(zipBuf);
  const cardsJson = JSON.parse(await zip.file("cards.json").async("string"));

  setLoaderProgress("加载日文卡包名映射...");
  const releaseDates = await rdResp.json();
  const packMap = {}; // cid -> 日文首次卡包的中文翻译
  const rdMap = {};   // cid -> { release: { jp: { date } } }
  const excludeCIDs = new Set(); // 要排除的卡：超速决斗 + 无日版发售日
  const today = new Date().toISOString().slice(0, 10);
  for (const entry of releaseDates) {
    const jp = entry.release?.jp;
    if (!jp?.date || jp.date > today) { excludeCIDs.add(entry.cid); continue; }
    if (jp.pack && /speed\s*duel|スピード\s*デュエル|ハイスピード/i.test(jp.pack)) { excludeCIDs.add(entry.cid); continue; }
    if (jp.pack) packMap[entry.cid] = translatePackName(jp.pack);
    rdMap[entry.cid] = entry;
  }
  setLoaderProgress(`已过滤：${excludeCIDs.size} 张超速决斗/未发售卡`, "继续解码...");

  setLoaderProgress("解码卡片数据", "字段转换中...");
  const result = [];
  let i = 0;
  for (const [cid, raw] of Object.entries(cardsJson)) {
    i++;
    if (i % 2000 === 0) setLoaderProgress(`解码中 ${i}/${Object.keys(cardsJson).length}`, "字段转换...");
    // 优先使用 YGOPro 官方中文译名
    let name = YGOPRO_NAME_MAP && raw.data && YGOPRO_NAME_MAP[String(raw.id)];
    if (!name) name = raw.sc_name || raw.cn_name || raw.md_name || raw.jp_name;
    if (!name) continue;
    if (!raw.data) continue;
    const type = decodeType(raw.data.type);
    const attr = type === "monster" ? decodeAttr(raw.data.attribute) : null;
    const race = type === "monster" ? decodeRace(raw.data.race, raw.text?.types) : null;
    const level = type === "monster" ? raw.data.level : null;
    const atk = type === "monster" ? raw.data.atk : null;
    const def = type === "monster" ? raw.data.def : null;
    const pack = packMap[parseInt(cid)] || packMap[raw.cid] || null;
  // 不再因为没有卡包跳过 — jp.pack 几乎所有卡都有
  // 但排除 CID 在 excludeCIDs 里的（超速决斗/未发售）
  if (excludeCIDs.has(raw.cid)) continue;
  // 发售日期（YYYY-MM-DD 格式）
  const jpRelease = raw.cid && rdMap[raw.cid]?.release?.jp?.date || null;
  const tp = decodeThreeParts(type, raw.text?.types);
  const effectTag = matchEffectTag(raw.id, raw.text?.types, raw.text?.desc);
  // 卡包信息：优先 YGOPro pack.db，fallback 到 ygocdb releaseDates
  let packName = null, packDate = null;
  if (YGOPRO_PACK_MAP && raw.id && YGOPRO_PACK_MAP[String(raw.id)]) {
    const p = YGOPRO_PACK_MAP[String(raw.id)];
    packName = p.packName;
    packDate = p.date;
  } else {
    packDate = jpRelease; // ygocdb 的发售日作为 fallback
  }
  result.push({
      name, type, attribute: attr, race, level, atk, def,
      typeLabel: tp.typeLabel, summon: tp.summon, trait: tp.trait,
      effectTag,
      packName, packDate,
      series: (() => {
        if (YGOPRO_SERIES_MAP && raw.data && YGOPRO_SERIES_MAP[String(raw.id)]) {
          return YGOPRO_SERIES_MAP[String(raw.id)].split('\t')[0].trim();
        }
        return matchSeries(name, raw.text?.desc || "");
      })(),
      desc: raw.text?.desc || "",
      cid: raw.cid, id: raw.id
    });
  }

  // 存 IndexedDB（几乎无上限）
  setLoaderProgress(`写入 IndexedDB`, `${result.length} 张卡`);
  await idbPutCards(result);
  localStorage.setItem(META_MD5, latestMD5 || "unknown");

  // image URL 不存库，但运行时从 id 动态拼
  return result.map(c => ({
    ...c,
    image: `https://cdn.233.momobako.com/ygopro/pics/${c.id}.jpg`
  }));
}

// =============== 游戏状态 ===============
let CARDS = [];
const MAX_GUESS_KEY = "ygoldle_max_guess";  // localStorage
const DEFAULT_HINTS_PER_ROUND = 3;
function getMaxGuess() {
  const v = parseInt(localStorage.getItem(MAX_GUESS_KEY) || '');
  return v > 0 ? v : 0;  // 0 = 无限
}
let state = { answer: null, guesses: [], gameOver: false, hintsLeft: DEFAULT_HINTS_PER_ROUND, hintedFields: new Set() };

function pickRandom() {
  if (CARDS.length === 0) return null;
  return CARDS[Math.floor(Math.random() * CARDS.length)];
}

function surrender() {
  state.gameOver = true;
  // 中断连胜（设为 0 或 -1？让 showResult 里 win=false 就会自然中断）
  showResult(true);  // 参数 win=false
  renderStatusBar();
}

function startNewRound() {
  state.answer = pickRandom();
  state.guesses = [];
  state.gameOver = false;
  state.hintsLeft = DEFAULT_HINTS_PER_ROUND;
  state.hintedFields = new Set();
  document.getElementById('guess-count').textContent = '0';
  document.getElementById('streak').textContent = getStreak();
  document.getElementById('total-cards').textContent = CARDS.length;
  const mg = getMaxGuess();
  document.getElementById('max-guess').textContent = mg === 0 ? '∞' : mg;
  document.getElementById('hint-left').textContent = state.hintsLeft;
  document.getElementById('history-area').style.display = 'none';
  document.querySelector('#history-table tbody').innerHTML = '';
  document.getElementById('result-area').style.display = 'none';
  document.getElementById('game-area').style.display = 'block';
  document.getElementById('legend-area').style.display = 'block';
  const input = document.getElementById('card-input');
  input.value = ''; input.focus();
  document.getElementById('suggestions').innerHTML = '';
  updateHintBtn();
}

function getStreak() { return parseInt(localStorage.getItem(STREAK_KEY) || '0'); }
function setStreak(v) { localStorage.setItem(STREAK_KEY, String(v)); }

// =============== 输入建议 ===============
function onInputChange() {
  const val = document.getElementById('card-input').value.trim().toLowerCase();
  const sug = document.getElementById('suggestions');
  if (!val) { sug.innerHTML = ''; return; }
  const matches = CARDS.filter(c => c.name.toLowerCase().includes(val)).slice(0, 10);
  sug.innerHTML = matches.map(c =>
    `<div class="suggestion-item" onclick="selectCard(${c.cid})">
      ${c.name} <span style="color:#888;">[${c.typeLabel}${c.summon?'・'+c.summon:''}${c.trait?'・'+c.trait:''} · ${c.packName || '-'} · ${c.packDate || '-'}]</span>
    </div>`
  ).join('');
}
function selectCard(cid) {
  const c = CARDS.find(x => x.cid === cid);
  if (!c) return;
  document.getElementById('card-input').value = c.name;
  document.getElementById('suggestions').innerHTML = '';
  tryGuess();
}

// =============== 猜测逻辑 ===============
function tryGuess() {
  if (state.gameOver || !state.answer) return;
  const name = document.getElementById('card-input').value.trim();
  if (!name) return;
  const card = CARDS.find(c => c.name === name);
  if (!card) { alert(`未找到"${name}"！`); return; }
  if (state.guesses.some(g => g.card.cid === card.cid)) { alert(`已经猜过"${card.name}"了！`); return; }

  const comp = compareCard(card, state.answer);
  state.guesses.push({ card, comparison: comp });
  document.getElementById('guess-count').textContent = state.guesses.length;
  renderHistory();
  document.getElementById('card-input').value = '';
  document.getElementById('suggestions').innerHTML = '';

  if (card.cid === state.answer.cid) {
    state.gameOver = true;
    setStreak(getStreak() + 1);
    showResult();
    return;
  }
  // 检查上限
  const mg = getMaxGuess();
  if (mg > 0 && state.guesses.length >= mg) {
    state.gameOver = true;
    setStreak(0);
    showResult();
  }
}

// =============== 提示功能 ===============
// 字段列表（顺序和表头一致）
const FIELDS = [
  { key: 'typeLabel', label: '基础', cat: 'text' },
  { key: 'summon',    label: '详细', cat: 'text' },
  { key: 'trait',     label: '类型', cat: 'text' },
  { key: 'attribute', label: '属性', cat: 'text' },
  { key: 'race',      label: '种族', cat: 'text' },
  { key: 'level',     label: '等级', cat: 'num' },
  { key: 'series',    label: '系列', cat: 'text' },
  { key: 'effectTag', label: '效果', cat: 'text' },
  { key: 'atk',       label: 'ATK',  cat: 'num' },
  { key: 'def',       label: 'DEF',  cat: 'num' },
  { key: 'packName',  label: '卡包', cat: 'text' },
  { key: 'packDate',  label: '发售', cat: 'num' }
];
const FIELDS_FOR_HINT = FIELDS;
function updateHintBtn() {
  const btn = document.getElementById('hint-btn');
  if (!btn) return;
  btn.disabled = state.hintsLeft <= 0 || state.gameOver;
  btn.style.opacity = btn.disabled ? '0.4' : '1';
}
function useHint() {
  if (state.hintsLeft <= 0 || state.gameOver) return;
  // 1. 已猜中的字段（所有 green）
  const matchedKeys = new Set();
  for (const g of state.guesses) {
    for (const c of g.comparison) {
      if (c.match === 'green') matchedKeys.add(c.key);
    }
  }
  // 2. 已经提示过的字段
  const hintedKeys = state.hintedFields || new Set();
  // 3. 排除后剩余字段
  const unmatched = FIELDS_FOR_HINT.filter(f => !matchedKeys.has(f.key) && !hintedKeys.has(f.key));
  if (unmatched.length === 0) { alert('所有未匹配字段都已提示过了！'); return; }
  const field = unmatched[Math.floor(Math.random() * unmatched.length)];
  state.hintsLeft--;
  if (!state.hintedFields) state.hintedFields = new Set();
  state.hintedFields.add(field.key);  // 记住已提示
  document.getElementById('hint-left').textContent = state.hintsLeft;
  updateHintBtn();
  let valStr = state.answer[field.key];
  if (valStr === null || valStr === undefined) valStr = '-';
  const msg = `💡 提示：答案的【${field.label}】是\n\n${valStr}`;
  alert(msg);
}

// =============== 回答上限设置 ===============
function setGuessLimit() {
  const current = getMaxGuess();
  const v = prompt(`设置每回合最大猜测次数（0 = 无限）：`, String(current));
  if (v === null) return;
  const n = parseInt(v.trim());
  if (isNaN(n) || n < 0) { alert('请输入 0 或正整数'); return; }
  localStorage.setItem(MAX_GUESS_KEY, String(n));
  document.getElementById('max-guess').textContent = n === 0 ? '∞' : n;
  // 如果当前已超出上限，强制结算
  if (n > 0 && state.guesses.length >= n && !state.gameOver) {
    state.gameOver = true; setStreak(0); showResult();
  }
  alert(n === 0 ? '已设为无限' : `已设为 ${n} 次`);
}

function numOf(v) {
  if (v === null || v === undefined) return null;
  if (typeof v === 'number') return v;
  if (typeof v === 'string') {
    // releaseDate: "1999-03-06" → days since epoch
    if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return new Date(v).getTime();
    const n = Number(v);
    return isNaN(n) ? null : n;
  }
  return null;
}

function compareCard(guess, answer) {
  return FIELDS.map(f => {
    const g = guess[f.key], a = answer[f.key];
    if (g === null && a === null) return { ...f, match: 'green', value: '-' };
    if (g === null || a === null) return { ...f, match: 'red', value: formatField(f.key, g) };
    if (f.cat === 'text') {
      // 多值字段（系列、效果标签都是逗号分隔）支持部分命中（orange）
      if (f.key === 'series' || f.key === 'effectTag') {
        const gSet = new Set(String(g).split(', ').map(s => s.trim()).filter(Boolean));
        const aSet = new Set(String(a).split(', ').map(s => s.trim()).filter(Boolean));
        if (gSet.size === 0 && aSet.size === 0) return { ...f, match: 'green', value: '-' };
        if (gSet.size === 0 || aSet.size === 0) return { ...f, match: 'red', value: formatField(f.key, g) };
        const allMatch = [...gSet].every(x => aSet.has(x));
        const anyMatch = [...gSet].some(x => aSet.has(x));
        if (allMatch && gSet.size === aSet.size) {
          return { ...f, match: 'green', value: formatField(f.key, g) };
        } else if (anyMatch) {
          return { ...f, match: 'orange', value: formatField(f.key, g) };
        } else {
          return { ...f, match: 'red', value: formatField(f.key, g) };
        }
      }
      return g === a
        ? { ...f, match: 'green', value: formatField(f.key, g) }
        : { ...f, match: 'red', value: formatField(f.key, g) };
    }
    const gn = numOf(g), an = numOf(a);
    if (gn === null || an === null) return { ...f, match: 'red', value: formatField(f.key, g) };
    if (gn === an) return { ...f, match: 'green', value: formatField(f.key, g) };
    const diff = Math.abs(gn - an);
    // 发售日期：按"年"比较，±1 年 → orange
    if (f.key === 'packDate') {
      const gYear = new Date(gn).getFullYear();
      const aYear = new Date(an).getFullYear();
      if (Math.abs(gYear - aYear) <= 1) {
        return { ...f, match: 'orange', value: formatField(f.key, g), extra: gn < an ? 'up' : 'down' };
      }
      return { ...f, match: 'red', value: formatField(f.key, g), extra: gn < an ? 'up' : 'down' };
    }
    // ATK / DEF：±300 → orange
    if ((f.key === 'atk' || f.key === 'def') && diff <= 300) {
      return { ...f, match: 'orange', value: formatField(f.key, g), extra: gn < an ? 'up' : 'down' };
    }
    // 等级：±1 → orange
    if (f.key === 'level' && diff <= 1) {
      return { ...f, match: 'orange', value: formatField(f.key, g), extra: gn < an ? 'up' : 'down' };
    }
    return { ...f, match: 'red', value: formatField(f.key, g), extra: gn < an ? 'up' : 'down' };
  });
}

function formatField(key, val) {
  if (val === null || val === undefined) return '-';
  if (key === 'type') return TYPE_LABEL[val] || val;
  return val;
}

function renderHistory() {
  document.getElementById('history-area').style.display = 'block';
  const tbody = document.querySelector('#history-table tbody');
  tbody.innerHTML = state.guesses.map(g => {
    const tds = g.comparison.map(c => {
      let cls = `match-${c.match}`;
      let v = c.value;
      if (c.extra === 'up') v += ' ⬆️';
      if (c.extra === 'down') v += ' ⬇️';
      return `<td class="${cls}">${v}</td>`;
    }).join('');
    const win = g.card.cid === state.answer.cid;
    return `<tr>
      <td class="name-cell" ${win ? 'style="color:#ffd700;"' : ''}>
        <img src="${g.card.image}" alt="" style="width:28px;height:40px;vertical-align:middle;margin-right:6px;border-radius:3px;border:1px solid #555;" onerror="this.style.display='none'">
        ${win ? '🏆 ' : ''}${g.card.name}
      </td>${tds}</tr>`;
  }).join('');
}

function showResult(forceLose = false) {
  document.getElementById('game-area').style.display = 'none';
  document.getElementById('legend-area').style.display = 'none';
  const r = document.getElementById('result-area');
  r.style.display = 'block';
  const a = state.answer;
  const win = !forceLose && state.guesses.some(g => g.card.cid === a.cid);
  const title = win ? '🎉 恭喜！你找到了！' : '💀 回合结束，答案是';
  r.innerHTML = `
    <div class="result">
      <h2>${title}</h2>
      <div class="answer-name">${a.name}</div>
      <img src="${a.image}" alt="卡图" style="width:180px;margin:12px auto;border-radius:8px;border:2px solid #ffd700;box-shadow:0 0 20px rgba(255,215,0,0.3);" onerror="this.style.display='none'">
      <div class="hint-bar">
        <span class="hint-chip">${a.typeLabel}</span>
        ${a.summon ? `<span class="hint-chip" style="background:rgba(255,140,0,0.3);border-color:#ff8c00;">${a.summon}</span>` : ''}
        ${a.trait ? `<span class="hint-chip" style="background:rgba(100,200,255,0.2);border-color:#64c8ff;">${a.trait}</span>` : ''}
        ${a.attribute ? `<span class="hint-chip">${a.attribute}属性</span>` : ''}
        ${a.race ? `<span class="hint-chip">${a.race}</span>` : ''}
        ${a.level ? `<span class="hint-chip">Lv.${a.level}</span>` : ''}
        ${a.series ? `<span class="hint-chip" style="background:rgba(255,215,0,0.15);border-color:#ffd700;color:#ffd700;">⭐ 系列: ${a.series}</span>` : ''}
        ${a.effectTag ? `<span class="hint-chip" style="background:rgba(100,255,100,0.15);border-color:#6f6;color:#9f9;">🎯 ${a.effectTag}</span>` : ''}
        ${a.atk !== null ? `<span class="hint-chip">ATK ${a.atk}</span>` : ''}
        ${a.def !== null ? `<span class="hint-chip">DEF ${a.def}</span>` : ''}
        ${a.packName ? `<span class="hint-chip" style="background:rgba(100,100,255,0.15);border-color:#66f;">📦 ${a.packName}</span>` : ''}
        <span class="hint-chip">📅 ${a.packDate || '未知'}</span>
      </div>
      ${a.desc ? `<div style="margin-top:15px;padding:12px;background:rgba(255,255,255,0.05);border-radius:8px;border-left:3px solid #ffd700;color:#ccc;font-size:0.92em;line-height:1.7;">${a.desc}</div>` : ''}
      <p style="margin-top:15px;color:#aaa;">
        ${win ? `用时 <strong style="color:#ffd700;">${state.guesses.length}</strong> 次 · 当前连胜 <strong style="color:#ffd700;">${getStreak()}</strong>` : `已猜 <strong style="color:#aaa;">${state.guesses.length}</strong> 次 · 连胜已重置`}
      </p>
      <p style="margin-top:8px;">
        <a href="https://ygocdb.com/card/name/${encodeURIComponent(a.name)}" target="_blank" style="color:#ffd700;font-size:0.85em;">📎 查看 ygocdb 详情</a>
      </p>
      <button onclick="startNewRound()">🔄 下一张</button>
    </div>
  `;
}

// =============== 启动 ===============
async function init() {
  try {
    CARDS = await loadCardsFromAPI();
  } catch(e) {
    console.error(e);
    document.getElementById('loader-progress').innerHTML = '<span class="error">加载失败：' + e.message + '</span>';
    document.getElementById('loader-subtitle').textContent = '请检查网络或稍后重试';
    return;
  }

  if (CARDS.length === 0) {
    document.getElementById('loader-progress').innerHTML = '<span class="error">没有可用卡片</span>';
    return;
  }

  // 管理后台
  const params = new URLSearchParams(location.search);
  if (params.get('admin') === '1') {
    document.getElementById('admin-panel').style.display = 'block';
    document.getElementById('loader').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    renderAdmin();
    return;
  }

  document.getElementById('loader').style.display = 'none';
  document.getElementById('main').style.display = 'block';
  startNewRound();

  const input = document.getElementById('card-input');
  input.addEventListener('input', onInputChange);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') tryGuess(); });
  document.getElementById('guess-btn').addEventListener('click', tryGuess);
}

// =============== 管理后台（只读 + 手动刷新） ===============
function renderAdmin() {
  const a = document.getElementById('admin-panel');
  a.innerHTML = `
    <div class="card">
      <h2 style="color:#ffd700;margin-bottom:15px;">🛠️ 数据库管理</h2>
      <p style="color:#aaa;margin-bottom:15px;font-size:0.9em;">
        当前共 <strong style="color:#ffd700;">${CARDS.length}</strong> 张卡，数据来源 ygocdb.com 实时同步。
      </p>
      <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;">
        <button class="btn primary" onclick="hardRefresh()">🔄 强制刷新（重新下载全部数据）</button>
        <button class="btn" onclick="exportData()">⬇️ 导出 JSON</button>
        <button class="btn" onclick="indexedDB.deleteDatabase('ygoldle');localStorage.removeItem('cards_md5_v7');alert('缓存已清除');location.reload();">🗑️ 清除缓存</button>
        <button class="btn" onclick="location.href='?'">← 返回游戏</button>
      </div>
      <input id="admin-search" placeholder="搜索卡片名..." style="width:100%;padding:10px;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.15);border-radius:6px;color:#fff;margin-bottom:15px;" oninput="renderAdminList(this.value.trim())">
      <div id="admin-list" style="max-height:600px;overflow-y:auto;"></div>
    </div>
  `;
  renderAdminList('');
}
function renderAdminList(filter) {
  const list = document.getElementById('admin-list');
  const arr = filter
    ? CARDS.filter(c => c.name.includes(filter) || (c.pack && c.pack.includes(filter)))
    : CARDS;
  list.innerHTML = `
    <table class="admin-table" style="width:100%;font-size:0.8em;">
      <thead style="position:sticky;top:0;background:#1a0a2e;"><tr>
        <th style="text-align:left;">卡片名</th><th>类型</th><th>属性</th><th>种族</th><th>Lv</th><th>ATK</th><th>DEF</th><th>官方卡包</th>
      </tr></thead><tbody>
      ${arr.slice(0, 500).map(c => `
        <tr>
          <td style="text-align:left;font-weight:600;"><a href="https://ygocdb.com/card/name/${encodeURIComponent(c.name)}" target="_blank" style="color:#fff;">${c.name}</a></td>
          <td><span class="type-badge type-${c.type}">${TYPE_LABEL[c.type]}</span></td>
          <td>${c.attribute || '-'}</td>
          <td>${c.race || '-'}</td>
          <td>${c.level ?? '-'}</td>
          <td>${c.atk ?? '-'}</td>
          <td>${c.def ?? '-'}</td>
          <td style="color:#ffd700;">${c.pack || '-'}</td>
        </tr>`).join('')}
      </tbody></table>
    ${arr.length > 500 ? `<p style="color:#666;font-size:0.8em;margin-top:10px;">仅显示前 500 张，共 ${arr.length} 张</p>` : ''}
  `;
}

async function hardRefresh() {
  if (!confirm('强制刷新会重新下载完整数据库（几 MB），确定？')) return;
  localStorage.removeItem(META_MD5);
  // 清 IndexedDB
  try { indexedDB.deleteDatabase(DB_NAME); } catch(e) {}
  location.reload();
}
function exportData() {
  const blob = new Blob([JSON.stringify(CARDS, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `ygoldle-cards-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

init();
</script>
</body>
</html>
